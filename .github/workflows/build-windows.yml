name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "ui/**"
      - "arkiv.spec"
      - "requirements*.txt"
      - "packaging/**"
      - ".github/workflows/build-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build portable app
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Upload Arkiv Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: Arkiv-Windows
          path: dist/Arkiv-Windows.zip
          if-no-files-found: error
